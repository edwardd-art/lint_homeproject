[tool.poetry]
name = "financial-transactions"
version = "0.1.0"
description = "Обработка финансовых транзакций"
authors = ["Student <student@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.31.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-mock = "^3.14.0"
mypy = "^1.8.0"
flake8 = "^7.0.0"
black = "^24.0.0"
isort = "^5.13.0"
types-requests = "^2.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = true
mypy_path = ["."]
namespace_packages = true
explicit_package_bases = true

# Игнорируем только сторонние библиотеки без типов
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "requests.*"
]
ignore_missing_imports = true

[tool.isort]
profile = "black"
line_length = 100
force_sort_within_sections = true
force_single_line = false
combine_as_imports = false
skip = []  # явно указать НЕ пропускать ничего
skip_glob = []  # не пропускать по шаблону
extend_skip = []  # не расширять список пропускаемых
known_first_party = ["src"]